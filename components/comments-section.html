<section class="city-section comments-section" data-comment-key="">
    <details class="comments-accordion">
        <summary class="comments-summary">Give A Tip for This Place</summary>
        <div class="comments-body">
            <form class="comments-form" aria-label="Comment form">
                <label for="comment-name">Name</label>
                <input id="comment-name" name="name" type="text" placeholder="Your name">
                <input name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" style="display:none">

                <label for="comment-text">Comment</label>
                <textarea id="comment-text" name="comment" rows="4" placeholder="Your advice for visiting this place"></textarea>

                <button type="button">Post comment</button>
                <p class="comments-error" role="alert"></p>
                <p class="comments-status" role="status" aria-live="polite"></p>
            </form>
        </div>
    </details>

    <div class="comments-list" aria-live="polite">
        <p class="comments-empty">Be the first to give good advice for visiting this great city.</p>
    </div>
</section>
