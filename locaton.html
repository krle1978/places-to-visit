<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GPS Lokacija - Google Maps</title>

<!-- CSS -->
<link rel="stylesheet" href="assets/js/location-style.css" />

</head>
<body>

<div id="info">
    <b>Latitude:</b> <span id="lat">N/A</span><br>
    <b>Longitude:</b> <span id="lon">N/A</span><br>
    <b>Preciznost:</b> <span id="acc">N/A</span> m
</div>

<div id="map"></div>

<!-- JS -->
<script src="assets/js/location-script.js"></script>

<!-- Google Maps API KEY -->
<script async 
    src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap">
</script>

</body>
</html>
